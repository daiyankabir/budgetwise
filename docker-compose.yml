services:
  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=budgetwise
      - POSTGRES_USER=budgetwise
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-budgetwise_local_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetwise -d budgetwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://budgetwise:${POSTGRES_PASSWORD:-budgetwise_local_password}@database:5432/budgetwise
      - JWT_SECRET=${JWT_SECRET:-local-development-only-secret}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4201:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: